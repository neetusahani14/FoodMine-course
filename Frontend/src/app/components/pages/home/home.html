<app-search></app-search>
<app-tags></app-tags>
<app-not-found
[visible]="!foods || !foods.length"
resetLinkText="Reset Search"></app-not-found>
<ul>
  @for (food of foods;  track food.id) {
    <li >
     <a routerLink="/food/{{food.id}}">
        <img [src]="food.imageUrl" [alt]="food.name"/>
        <div class="content">
            <div class = "name">
            {{food.name}}
            </div>
            <span class="favorite {{food.favorite?'':'not'}}" >
              ❤
            </span>
            <div class="stars">
              <ngb-rating [rate]="food.stars"
               [max]="5"
               [readonly]="true"></ngb-rating>
            </div>
            <div class="product-item-footer">
              <div class="origins">
                @for (origin of food.origins; track origin) {
                  <span>
                  {{origin}}
                </span>
                }
                @for (origin of food.origins; track origin) {
                  <span>
                  {{origin}}
                </span>}
              </div>
              <div class="cook-time">
                <span>🕒</span>
                {{food.cookTime}}
              </div>
            </div>

            <div class="price">
              <span>
                {{food.price | currency:'USD'}}
              </span>
            </div>
        </div>

     </a>
    </li>

  }
    
</ul>
